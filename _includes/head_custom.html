<!-- Favicon includes -->
<link rel="icon" type="image/x-icon" href="{{ site.favicon_ico | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.favicon_32 | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ site.favicon_16 | relative_url }}">
<link rel="apple-touch-icon" href="{{ site.apple_touch_icon | relative_url }}">
 
<!-- Force cache reload for CSS and JS files -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0"> 

<!-- Custom CSS fixes -->
<style>
  .site-logo {
    width: 100%;
    height: 60px !important;
    min-height: 60px;
  }
</style>
