# Site settings for UILensAI
title: UILensAI
description: A visual UI analysis tool leveraging AI to evaluate UI implementations across multiple device sizes
url: https://uilensai.com
baseurl: ""
repository: optimald/UILensAI

# Build settings
markdown: kramdown
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-readme-index

# README.md as homepage
readme_index:
  enabled: true
  remove_originals: false
  with_frontmatter: false

# Theme settings
color_scheme: dark
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

heading_anchors: true
anchor_links: true

# Custom scss
sass:
  sass_dir: assets/css
  style: compressed

# Logo and favicon
logo: "/assets/images/uilensai-favicon.png"
favicon_ico: "/assets/images/favicon.ico"
# Additional favicon formats
favicon_32: "/assets/images/favicon-32x32.png"
favicon_16: "/assets/images/favicon-16x16.png"
apple_touch_icon: "/assets/images/apple-touch-icon.png"

# Aux links for the upper right navigation
aux_links:
  "UILensAI on GitHub":
    - "//github.com/optimald/UILensAI"
aux_links_new_tab: true

# Enable callouts
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red
  tip:
    title: Tip
    color: green
  new:
    title: New
    color: purple

# Navigation structure
nav_external_links:
  - title: GitHub
    url: "https://github.com/optimald/UILensAI"
    hide_icon: false
    opens_in_new_tab: true

# Enable copy button on code blocks
enable_copy_code_button: true

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer content
footer_content: "Copyright &copy; 2025 UILensAI. Distributed under an MIT license."
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Google Analytics
ga_tracking: 
ga_tracking_anonymize_ip: true

# Exclude files from being included in the build
exclude:
  - src/
  - node_modules/
  - storage/
  - reports/
  - test-site/
  - .env
  - package.json
  - package-lock.json
  - LICENSE
  - CHANGELOG.md
  - .git/
  - .github/
  - vendor
  - docs/ 